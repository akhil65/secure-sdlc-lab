name: Secret Scan

# WHEN this runs (the trigger):
on:
  push:
    branches: [ main ]      # every push to main
  pull_request:             # and every pull request

# WHAT runs:
jobs:
  gitleaks:                       # job id (our choice of name)
    name: Gitleaks secret scan    # label shown in the GitHub UI
    runs-on: ubuntu-latest        # the runner: a fresh Ubuntu VM

    steps:
      # Step 1: copy our repo onto the runner.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so gitleaks can scan every commit

      # Step 2: run Gitleaks (same tool you ran locally).
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
